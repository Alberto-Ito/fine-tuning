run_name: banking77-qwen3-0.6b-lora-pilot
model_name: Qwen/Qwen3-0.6B
dataset_config: configs/datasets/banking77.yaml

# Resource pilot: 50 optimization steps, not a complete epoch.
max_steps: 50
num_train_epochs: 1
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
max_length: 128

learning_rate: 0.00005
weight_decay: 0.01
warmup_ratio: 0.10
lr_scheduler_type: cosine

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj

logging_steps: 5
eval_steps: 25
save_steps: 25
save_total_limit: 2
seed: 42

output_dir: outputs/banking77/checkpoints/pilot
final_model_dir: outputs/banking77/final_model/pilot
logging_dir: outputs/banking77/logs/pilot
metrics_dir: outputs/banking77/metrics/pilot
