# Local Banking77 pilot for the Hugging Face model behind the Microsoft
# Foundry catalog entry qwen-qwen3.5-4b, version 1.
#
# This produces a PEFT sequence-classification adapter for local evaluation.
# Microsoft currently excludes Qwen 3.5 4B from LoRA adapter deployment on
# Fireworks/Foundry. See MS Foundry/qwen35_4b_v1/README.md before uploading.
run_name: banking77-qwen3.5-4b-v1-pilot-100
model_name: Qwen/Qwen3.5-4B
dataset_config: configs/datasets/banking77_pilot_100.yaml
max_steps: -1
num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
max_length: 128
learning_rate: 0.0001
weight_decay: 0.01
warmup_ratio: 0.10
lr_scheduler_type: cosine
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: [q_proj, v_proj]
logging_steps: 5
eval_steps: 5
save_steps: 5
save_total_limit: 1
seed: 42
dtype: bfloat16
output_dir: outputs/pilots/banking77_100/qwen35_4b_v1/checkpoints
final_model_dir: outputs/pilots/banking77_100/qwen35_4b_v1/model
logging_dir: outputs/pilots/banking77_100/qwen35_4b_v1/logs
metrics_dir: outputs/pilots/banking77_100/qwen35_4b_v1/metrics
predictions_dir: outputs/pilots/banking77_100/qwen35_4b_v1/predictions
report_dir: reports/pilots/banking77_100/qwen35_4b_v1
