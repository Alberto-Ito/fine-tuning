[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-finetuning"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
finetune-train = "finetuning.train:main"
finetune-evaluate = "finetuning.evaluate:main"
finetune-predict = "finetuning.predict:main"
