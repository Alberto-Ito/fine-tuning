run_name: banking77-qwen3.5-0.8b-lora-2epochs
model_name: Qwen/Qwen3.5-0.8B
dataset_config: configs/datasets/banking77.yaml

max_steps: -1
num_train_epochs: 2
per_device_train_batch_size: 4
per_device_eval_batch_size: 8
gradient_accumulation_steps: 2
max_length: 128

learning_rate: 0.0001
weight_decay: 0.01
warmup_ratio: 0.10
lr_scheduler_type: cosine

# Same LoRA scope as Qwen3-0.6B. Qwen3.5 also has linear-attention blocks;
# keeping q/v projection targets makes the comparison controlled.
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - v_proj

logging_steps: 25
eval_steps: 125
save_steps: 125
save_total_limit: 3
seed: 42

# Operational benchmark is batched inference over the full test split.
benchmark_warmup_batches: 3
benchmark_batch_size: 8

output_dir: outputs/banking77/checkpoints/two_epochs
final_model_dir: outputs/banking77/final_model/two_epochs
logging_dir: outputs/banking77/logs/two_epochs
metrics_dir: outputs/banking77/metrics/two_epochs
predictions_dir: outputs/banking77/predictions/two_epochs
report_dir: reports/tables
report_filename: banking77_two_epochs.md
report_title: "# Banking77 — Qwen3.5-0.8B, two epochs of LoRA fine-tuning"
confusion_matrix_filename: banking77_two_epochs_confusion_matrix.csv
